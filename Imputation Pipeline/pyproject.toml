[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssha-diffusion"
version = "0.1.0"
description = "Reconstruction of SSH anomaly fields with a 3D U-Net and conditional diffusion model"
requires-python = ">=3.9"

[tool.setuptools]
py-modules = [
    "data",
    "model",
    "diffusion_code",
    "losses",
    "spectra",
    "spectral_loss",
    "viz",
    "compute_global_crps",
]
package-dir = {"" = "src"}
